<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Snake 60 FPS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        html, body {
            touch-action: manipulation;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 12px;
        }
        .game-container {
            text-align: center;
            background: rgba(30, 41, 59, 0.7);
            padding: 24px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin-bottom: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            gap: 10px;
        }
        .score-box {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .score-box span {
            color: #38bdf8;
            font-size: 1.3rem;
        }
        #best-box span {
            color: #f43f5e;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        canvas {
            border: 4px solid #818cf8;
            border-radius: 10px;
            background-color: #020617;
            box-shadow: 0 0 25px rgba(129, 140, 248, 0.4);
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
        }
        .overlay {
            position: absolute;
            inset: 4px;
            border-radius: 8px;
            background: rgba(2, 6, 23, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            padding: 20px;
        }
        .overlay.visible {
            display: flex;
        }
        .overlay h2 {
            color: #f43f5e;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .overlay p {
            color: #cbd5e1;
            font-size: 1rem;
        }
        .restart-btn {
            background: linear-gradient(to right, #38bdf8, #818cf8);
            border: none;
            color: #020617;
            font-weight: bold;
            font-size: 1rem;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .restart-btn:active {
            transform: scale(0.96);
        }
        .controls-info {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* --- Telefon uchun ekran tugmalari (D-pad) --- */
        .dpad {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 64px 64px 64px;
            grid-template-rows: 56px 56px 56px;
            gap: 6px;
            justify-content: center;
        }
        .dpad-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(129, 140, 248, 0.4);
            border-radius: 12px;
            color: #38bdf8;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }
        .dpad-btn:active {
            background: rgba(56, 189, 248, 0.3);
            transform: scale(0.94);
        }
        .dpad-up    { grid-column: 2; grid-row: 1; }
        .dpad-left  { grid-column: 1; grid-row: 2; }
        .dpad-center{ grid-column: 2; grid-row: 2; visibility: hidden; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down  { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Neon Snake</h1>
    <div class="scoreboard">
        <div class="score-box">Ball: <span id="score">0</span></div>
        <div class="score-box" id="best-box">Rekord: <span id="bestScore">0</span></div>
    </div>
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="overlay" id="overlay">
            <h2>O'yin tugadi</h2>
            <p id="overlay-score"></p>
            <button class="restart-btn" id="restart-btn">Qayta boshlash</button>
        </div>
    </div>
    <div class="controls-info">Kompyuterda: strelkalar. Telefonda: pastdagi tugmalar</div>

    <!-- Telefon uchun ekran tugmalari -->
    <div class="dpad">
        <div class="dpad-btn dpad-up" data-dir="up">▲</div>
        <div class="dpad-btn dpad-left" data-dir="left">◀</div>
        <div class="dpad-btn dpad-center"></div>
        <div class="dpad-btn dpad-right" data-dir="right">▶</div>
        <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const bestScoreElement = document.getElementById("bestScore");
    const overlayEl = document.getElementById("overlay");
    const overlayScoreEl = document.getElementById("overlay-score");
    const restartBtn = document.getElementById("restart-btn");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 0, y: 0 };
    let score = 0;
    // localStorage bu muhitda ishlamaydi — rekord sessiya xotirasida saqlanadi
    let bestScore = 0;
    bestScoreElement.innerText = bestScore;

    let currentDir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };

    let moveCooldown = 0.12;
    let moveTimer = 0;
    let lastTime = 0;
    let isGameOver = false;

    function initGame() {
        snake = [
            { x: 7, y: 10 },
            { x: 6, y: 10 },
            { x: 5, y: 10 }
        ];
        currentDir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        moveCooldown = 0.12;
        score = 0;
        scoreElement.innerText = score;
        isGameOver = false;
        moveTimer = 0;
        overlayEl.classList.remove("visible");
        spawnFood();
    }

    function spawnFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);

        for (let part of snake) {
            if (part.x === food.x && part.y === food.y) {
                spawnFood();
                break;
            }
        }
    }

    function setDirection(name) {
        if (isGameOver) return;
        if (name === "up" && currentDir.y === 0) nextDir = { x: 0, y: -1 };
        else if (name === "down" && currentDir.y === 0) nextDir = { x: 0, y: 1 };
        else if (name === "left" && currentDir.x === 0) nextDir = { x: -1, y: 0 };
        else if (name === "right" && currentDir.x === 0) nextDir = { x: 1, y: 0 };
    }

    // --- Klaviatura (kompyuter uchun) ---
    window.addEventListener("keydown", (e) => {
        switch (e.key) {
            case "ArrowUp": setDirection("up"); break;
            case "ArrowDown": setDirection("down"); break;
            case "ArrowLeft": setDirection("left"); break;
            case "ArrowRight": setDirection("right"); break;
            case "Enter": if (isGameOver) initGame(); break;
        }
    });

    // --- Ekran tugmalari (telefon uchun, sichqon bilan ham ishlaydi) ---
    document.querySelectorAll(".dpad-btn[data-dir]").forEach(btn => {
        const dir = btn.getAttribute("data-dir");

        btn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            setDirection(dir);
        }, { passive: false });

        btn.addEventListener("mousedown", (e) => {
            e.preventDefault();
            setDirection(dir);
        });
    });

    restartBtn.addEventListener("click", () => {
        initGame();
    });
    restartBtn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        initGame();
    }, { passive: false });

    document.querySelectorAll("button, .dpad-btn").forEach(el => {
        el.addEventListener("touchend", (e) => e.preventDefault(), { passive: false });
    });

    function gameLoop(timeStamp) {
        let deltaTime = (timeStamp - lastTime) / 1000;
        if (isNaN(deltaTime)) deltaTime = 0;
        lastTime = timeStamp;

        if (!isGameOver) {
            moveTimer += deltaTime;
            if (moveTimer >= moveCooldown) {
                moveTimer = 0;
                updatePhysics();
            }
        }

        drawGridAndElements();
        requestAnimationFrame(gameLoop);
    }

    function updatePhysics() {
        currentDir = nextDir;

        const head = {
            x: snake[0].x + currentDir.x,
            y: snake[0].y + currentDir.y
        };

        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            endGame();
            return;
        }

        for (let i = 0; i < snake.length; i++) {
            if (head.x === snake[i].x && head.y === snake[i].y) {
                endGame();
                return;
            }
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreElement.innerText = bestScore;
            }
            spawnFood();

            if (moveCooldown > 0.05) {
                moveCooldown -= 0.002;
            }
        } else {
            snake.pop();
        }
    }

    // Mobil qurilmalarda noqulay bo'lgan alert() o'rniga ekran ichidagi overlay
    function endGame() {
        isGameOver = true;
        overlayScoreEl.innerText = "Ball: " + score + " | Rekord: " + bestScore;
        overlayEl.classList.add("visible");
    }

    function drawGridAndElements() {
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.shadowBlur = 0;

        ctx.shadowColor = "#f43f5e";
        ctx.shadowBlur = 15;
        ctx.fillStyle = "#f43f5e";
        ctx.beginPath();
        let fx = food.x * gridSize + gridSize / 2;
        let fy = food.y * gridSize + gridSize / 2;
        ctx.arc(fx, fy, gridSize / 2 - 2, 0, Math.PI * 2);
        ctx.fill();

        snake.forEach((part, index) => {
            if (index === 0) {
                ctx.shadowColor = "#38bdf8";
                ctx.shadowBlur = 15;
                ctx.fillStyle = "#38bdf8";
            } else {
                ctx.shadowColor = "#34d399";
                ctx.shadowBlur = 8;
                ctx.fillStyle = "#34d399";
            }

            ctx.fillRect(
                part.x * gridSize + 1,
                part.y * gridSize + 1,
                gridSize - 2,
                gridSize - 2
            );
        });
    }

    initGame();
    requestAnimationFrame(gameLoop);
</script>

</body>
</html>
